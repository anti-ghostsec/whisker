name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install system libraries
        run: |
          sudo apt-get -o Acquire::Retries=6 update
          sudo apt-get -o Acquire::Retries=6 install -y --no-install-recommends \
            cmake clang libclang-dev nasm pkg-config \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxcb-sync-dev libxcb-xinerama0-dev \
            libxcb-icccm4-dev libxcb-keysyms1-dev libxcb-util-dev libxcb-cursor-dev \
            libdbus-1-dev libssl-dev

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

  linux:
    name: Linux
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install system libraries
        run: |
          sudo apt-get -o Acquire::Retries=6 update
          sudo apt-get -o Acquire::Retries=6 install -y --no-install-recommends \
            cmake clang libclang-dev nasm pkg-config \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxcb-sync-dev libxcb-xinerama0-dev \
            libxcb-icccm4-dev libxcb-keysyms1-dev libxcb-util-dev libxcb-cursor-dev \
            libdbus-1-dev libssl-dev

      - name: Build
        run: cargo build --release --locked -p whisker -p whisker-agentd

      - name: Package
        run: |
          mkdir -p dist/whisker-linux-x86_64
          cp target/release/whisker target/release/whisker-agentd dist/whisker-linux-x86_64/
          cp README.md apps/whisker/whisker.desktop dist/whisker-linux-x86_64/
          tar -C dist -czf dist/whisker-linux-x86_64.tar.gz whisker-linux-x86_64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whisker-linux-x86_64
          path: dist/whisker-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows
    needs: check
    runs-on: windows-2022
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build
        run: cargo build --release --locked -p whisker -p whisker-agentd

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/whisker-windows-x86_64 | Out-Null
          Copy-Item target/release/whisker.exe, target/release/whisker-agentd.exe, README.md dist/whisker-windows-x86_64/
          Compress-Archive -Path dist/whisker-windows-x86_64 -DestinationPath dist/whisker-windows-x86_64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whisker-windows-x86_64
          path: dist/whisker-windows-x86_64.zip
          if-no-files-found: error

  android:
    name: Android
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Android build tools
        run: |
          sudo apt-get -o Acquire::Retries=6 update
          sudo apt-get -o Acquire::Retries=6 install -y --no-install-recommends clang llvm lld

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with:
          ndk-version: r27c

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # xbuild, with one manifest setting it doesn't know yet:
      # requestLegacyExternalStorage (Android 10 shows the phone's folders
      # only to apps that ask for it).
      - name: Install xbuild
        run: |
          git clone --quiet https://github.com/rust-mobile/xbuild.git "$RUNNER_TEMP/xbuild"
          cd "$RUNNER_TEMP/xbuild"
          git checkout --quiet e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1
          python3 - <<'EOF'
          p = "apk/src/manifest.rs"
          t = open(p).read()
          old = "    pub app_component_factory: Option<String>,\n"
          assert t.count(old) == 1
          t = t.replace(old, old + '    #[serde(rename(serialize = "android:requestLegacyExternalStorage"))]\n    pub request_legacy_external_storage: Option<bool>,\n')
          open(p, "w").write(t)
          EOF
          cargo install --path xbuild --locked

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: x build -p whisker --platform android --arch arm64 --release --format apk

      # xbuild signs with its own built-in debug key. The APK is re-signed
      # with Whisker's release key, from the ANDROID_KEYSTORE_BASE64 (the
      # PKCS12 keystore, base64) and ANDROID_KEYSTORE_PASSWORD secrets (key
      # alias whisker), and must carry the certificate whose SHA-256 is in
      # apps/whisker/android-release-cert.sha256. Pull requests don't get the
      # secrets, so their test APKs keep the debug key; any other build
      # without the key fails.
      - name: Sign with the release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          apk=target/x/release/android/whisker.apk
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "::notice::No release key in a pull request: this test APK keeps xbuild's debug key."
              exit 0
            fi
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets: no APK without the release key."
            exit 1
          fi
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          ks="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          "${tools}apksigner" sign --ks "$ks" --ks-key-alias whisker \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$RUNNER_TEMP/whisker-signed.apk" "$apk"
          mv "$RUNNER_TEMP/whisker-signed.apk" "$apk"
          # Signed with Whisker's key, not some other one.
          certs=$("${tools}apksigner" verify --print-certs "$apk")
          printf '%s\n' "$certs"
          got=$(printf '%s\n' "$certs" | sed -n 's/^Signer.*certificate SHA-256 digest: //p' | head -1)
          echo "Signing certificate SHA-256: $got"
          [ "$got" = "$(tr -d '[:space:]' < apps/whisker/android-release-cert.sha256)" ] || { echo "::error::Signed with $got, not Whisker's release key" >&2; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whisker-android-arm64
          path: target/x/release/android/whisker.apk
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      # Only an APK signed with Whisker's release key is published.
      - name: Check the APK's signature
        run: |
          set -eu
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          certs=$("${tools}apksigner" verify --print-certs dist/whisker.apk)
          printf '%s\n' "$certs"
          got=$(printf '%s\n' "$certs" | sed -n 's/^Signer.*certificate SHA-256 digest: //p' | head -1)
          [ "$got" = "$(tr -d '[:space:]' < apps/whisker/android-release-cert.sha256)" ] || { echo "::error::The APK is signed with $got, not Whisker's release key" >&2; exit 1; }

      - name: Attach artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
