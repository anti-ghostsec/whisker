[package]
name = "whisker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "whisker"
path = "src/main.rs"

[dependencies]
whisker-core.workspace = true
whisker-agent.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
chrono.workspace = true
matrix-sdk.workspace = true
directories.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
slint = "1.18.1"


[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree (accessibility, file dialogs); used for notifications.
zbus = "5"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
# Reading share intents (already in the tree through Slint's Android backend).
jni = "0.21"

[build-dependencies]
slint-build = "1.18.1"

[package.metadata.android]
package = "io.github.antighostsec.whisker"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Bringing the open Whisker to the front when something is shared to it.
[[package.metadata.android.uses_permission]]
name = "android.permission.REORDER_TASKS"

# Whisker shows up in other apps' Share menus, for any files or text.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.SEND", "android.intent.action.SEND_MULTIPLE"]
categories = ["android.intent.category.DEFAULT"]
[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "*/*"
