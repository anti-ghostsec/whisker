[package]
name = "whisker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "whisker"
path = "src/main.rs"

[dependencies]
url = "2"
whisker-core.workspace = true
whisker-agent.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# SVG pictures (Slint already builds these): drawn here, never fetching
# anything an SVG names.
resvg = { version = "0.49", default-features = false, features = ["text", "raster-images", "svgz"] }
fontdb = { version = "0.24", default-features = false, features = ["std", "fs"] }
# Typst: maths and small typeset documents, made into pictures here. Its
# own fonts only (embedded), no files and no packages (nothing fetched).
typst = "0.15.1"
typst-render = "0.15.1"
typst-layout = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
chrono.workspace = true
matrix-sdk.workspace = true
directories.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
slint = "1.19.0"


[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17.2"
# Drag selection across messages (select.rs) reads the window's mouse and
# Slint's item tree, which only these expose. Pinned: unstable APIs.
slint = { version = "1.19.0", features = ["unstable-winit-030"] }
i-slint-core = "=1.19.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree (accessibility, file dialogs); used for notifications.
zbus = "5"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19.0", features = ["backend-android-activity-06"] }
# Reading share intents (already in the tree through Slint's Android backend).
jni = "0.21"
# Playing videos and sound with the phone's own decoders (android_player.rs);
# already in the tree through Slint's Android backend.
ndk = { version = "0.9", features = ["media", "audio", "api-level-26"] }
ndk-sys = { version = "0.6", features = ["media"] }

[build-dependencies]
slint-build = "1.19.0"

# Android permissions, name and Share menu entry are in manifest.yaml.
