# Android settings for xbuild (`x build --platform android`). xbuild reads
# this file, not [package.metadata.android] in Cargo.toml.
android:
  manifest:
    package: io.github.antighostsec.whisker
    uses_permission:
      - name: android.permission.INTERNET
      # Bringing the open Whisker to the front when something is shared to it.
      - name: android.permission.REORDER_TASKS
      # Choosing files to send, pictures and key files (Whisker's own file
      # list, see picker.rs): photos, videos and music (Android 13 and later),
      # all of them (older Android), or every file when the user allows it.
      - name: android.permission.READ_MEDIA_IMAGES
      - name: android.permission.READ_MEDIA_VIDEO
      - name: android.permission.READ_MEDIA_AUDIO
      - name: android.permission.READ_EXTERNAL_STORAGE
      - name: android.permission.MANAGE_EXTERNAL_STORAGE
    application:
      label: Whisker
      activities:
        # Whisker shows up in other apps' Share menus, for any files or text.
        - intent_filters:
            - actions:
                - android.intent.action.SEND
                - android.intent.action.SEND_MULTIPLE
              categories:
                - android.intent.category.DEFAULT
              data:
                - mime_type: "*/*"
