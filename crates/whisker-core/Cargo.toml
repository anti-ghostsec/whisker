[package]
name = "whisker-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
futures-util.workspace = true
getrandom.workspace = true
flate2 = "1.1.10"
mime_guess = "2.0.5"
# Metadata removal, conversion and previews of pictures before upload (the version the app uses).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
sha2 = "0.10.9"
# Upload progress (the version matrix-sdk uses).
eyeball = "0.8.8"
# Same version matrix-sdk-sqlite uses, for consistent snapshots of its databases.
rusqlite = { version = "0.40.2", default-features = false }
matrix-sdk.workspace = true
# Its media decryptor, which matrix-sdk doesn't re-export.
matrix-sdk-base = { version = "0.19.1", default-features = false, features = ["e2e-encryption"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

# Certificates are checked in the app on Android (see src/tls.rs).
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[dev-dependencies]
matrix-sdk = { workspace = true, features = ["testing"] }
matrix-sdk-test = "0.19.1"
wiremock = "0.6.5"
serde_json.workspace = true
